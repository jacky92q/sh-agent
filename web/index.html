<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)" />
<meta name="description" content="Private chat interface for a local model." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="sh-agent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>sh-agent</title>
<meta name="build" content="__BUILD__" />
<script>
  // GitHub Pages caches this document itself for a while (the asset-hash
  // trick in the workflow only busts app.js/styles.css), so a phone that
  // already had the page open could sit on a stale build until someone
  // thought to pull down and refresh. Every load quietly re-fetches the
  // real HTML over the network — bypassing that cache — and reloads once
  // if the build stamp actually differs. No visible flash on a fresh load;
  // this races in parallel with normal parsing and only acts on a mismatch.
  (function () {
    if (sessionStorage.getItem('sh-agent:reloaded-for-build')) return;
    fetch(location.pathname, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var latest = html.match(/<meta name="build" content="([^"]+)"/);
        var mine = document.querySelector('meta[name="build"]');
        if (!latest || !mine || latest[1] === mine.content) return;
        sessionStorage.setItem('sh-agent:reloaded-for-build', '1');
        var bust = (location.search ? '&' : '?') + '_b=' + Date.now();
        location.replace(location.pathname + location.search + bust + location.hash);
      })
      .catch(function () {});
  })();
</script>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0b'/><circle cx='16' cy='16' r='5' fill='%23c96f4a'/></svg>" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="대화 목록">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>

  <div class="identity">
    <span class="wordmark">sh<span class="dot-sep">·</span>agent</span>
    <span class="subline" id="modelLabel">연결 대기</span>
  </div>

  <div class="topbar-actions">
    <button class="status" id="statusBtn" aria-label="연결 상태">
      <span class="status-led" data-state="idle" id="statusLed"></span>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 7.5l2 1.2M17.5 15.3l2 1.2M4.5 16.5l2-1.2M17.5 8.7l2-1.2"/></svg>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="thread" id="thread" role="log" aria-live="polite"></div>

  <section class="overture" id="overture">
    <div class="overture-mark" aria-hidden="true">
      <span class="ring"></span><span class="core"></span>
    </div>
    <h1>로컬에서 도는 모델과<br />조용히 대화하기</h1>
    <p class="overture-sub">이 화면은 당신의 PC에 있는 모델에 직접 연결됩니다. 대화는 어디에도 남지 않습니다.</p>
    <div class="seeds" id="seeds"></div>
  </section>
</main>

<footer class="composer-wrap">
  <div class="active-presets" id="activePresets" hidden></div>
  <div class="attach-strip" id="attachStrip" hidden></div>

  <form class="composer" id="composer">
    <input type="file" id="fileInput" accept="image/*,audio/*,.mp3,.wav,.m4a,.ogg,.oga,.webm,.flac,.aac,.opus,.pdf,.txt,.md,.markdown,.csv,.tsv,.json,.yaml,.yml,.log,.js,.mjs,.cjs,.ts,.jsx,.tsx,.py,.java,.c,.h,.cpp,.hpp,.go,.rs,.rb,.php,.html,.htm,.css,.scss,.sh,.bash,.ps1,.sql,.xml,.ini,.toml,.conf,.env" multiple hidden />
    <button type="button" class="pill-btn" id="attachBtn" aria-label="파일 첨부">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7.5l-7.1 7.1a2.5 2.5 0 0 0 3.54 3.54l7.1-7.1a4.5 4.5 0 1 0-6.36-6.36L6.5 11.86a6.5 6.5 0 1 0 9.19 9.19"/></svg>
    </button>

    <textarea id="input" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea>

    <button type="button" class="pill-btn" id="micBtn" hidden aria-label="음성 입력">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      <span class="mic-ring" aria-hidden="true"></span>
    </button>

    <button type="submit" class="send" id="send" aria-label="보내기">
      <svg class="ic-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6"/></svg>
      <span class="ic-stop" aria-hidden="true"></span>
    </button>
  </form>
  <p class="hint" id="hint">Enter 전송 · Shift+Enter 줄바꿈</p>
</footer>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="메뉴">
  <div class="drawer-tabs" role="tablist">
    <button class="drawer-tab active" type="button" data-tab="chats" role="tab" aria-selected="true">대화</button>
    <button class="drawer-tab" type="button" data-tab="agents" role="tab" aria-selected="false">에이전트</button>
    <button class="drawer-tab" type="button" data-tab="skills" role="tab" aria-selected="false">스킬</button>
  </div>

  <div class="drawer-panel" data-panel="chats">
    <div class="drawer-panel-head">
      <button class="ghost-btn" id="newChatBtn">새 대화</button>
    </div>
    <div class="history" id="history"></div>
  </div>

  <div class="drawer-panel" data-panel="agents" hidden>
    <div class="drawer-panel-head">
      <span class="panel-note">한 번에 하나만 켤 수 있어요</span>
      <button class="ghost-btn" id="newAgentBtn">+ 만들기</button>
    </div>
    <div class="preset-list" id="agentList"></div>
  </div>

  <div class="drawer-panel" data-panel="skills" hidden>
    <div class="drawer-panel-head">
      <span class="panel-note">여러 개 동시에 켤 수 있어요</span>
      <button class="ghost-btn" id="newSkillBtn">+ 만들기</button>
    </div>
    <div class="preset-list" id="skillList"></div>
  </div>
</aside>

<section class="sheet" id="sheet" hidden aria-label="설정">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="panel-title">연결</span>
    <button class="ghost-btn" id="sheetClose">닫기</button>
  </div>

  <div class="sheet-body">
    <p class="setup-hint" id="setupHint" hidden></p>

    <label class="field">
      <span class="field-label">서버 주소</span>
      <input id="fEndpoint" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://xxx.trycloudflare.com" />
      <span class="field-note">PC에서 <code>start.ps1</code> 실행 시 출력되는 터널 주소</span>
    </label>

    <label class="field">
      <span class="field-label">액세스 키</span>
      <input id="fToken" type="password" autocapitalize="off" autocorrect="off" placeholder="릴레이가 발급한 키" />
    </label>

    <div class="probe">
      <button class="ghost-btn wide" id="testBtn">연결 확인</button>
      <span class="probe-msg" id="probeMsg"></span>
    </div>

    <hr class="rule" />
    <span class="panel-title">모델</span>

    <label class="field">
      <span class="field-label">사용할 모델</span>
      <div class="select-wrap">
        <select id="fModel"><option value="">연결 후 자동으로 채워집니다</option></select>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </label>

    <label class="field">
      <span class="field-label">시스템 프롬프트</span>
      <textarea id="fSystem" rows="3" placeholder="말투나 역할을 정해두세요"></textarea>
    </label>

    <label class="field">
      <span class="field-label">온도 <b id="tempVal">0.7</b></span>
      <input id="fTemp" type="range" min="0" max="1.4" step="0.1" value="0.7" />
    </label>
  </div>
</section>

<section class="sheet" id="presetSheet" hidden aria-label="에이전트·스킬 편집">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="panel-title" id="presetSheetTitle">만들기</span>
    <button class="ghost-btn" id="presetSheetClose">닫기</button>
  </div>

  <div class="sheet-body">
    <p class="setup-hint" id="presetHint"></p>

    <div class="field-row">
      <label class="field">
        <span class="field-label">이름</span>
        <input id="presetName" type="text" autocomplete="off" placeholder="번역가" maxlength="40" />
      </label>

      <label class="field">
        <span class="field-label">설명 <span class="field-optional">선택</span></span>
        <input id="presetDesc" type="text" autocomplete="off" placeholder="목록에 보일 한 줄" maxlength="80" />
      </label>
    </div>

    <label class="field">
      <span class="field-label">지침</span>
      <textarea id="presetInstructions" rows="8" placeholder="모델에게 전달할 역할·말투·규칙을 적어주세요"></textarea>
    </label>

    <div class="preset-editor-actions">
      <button class="ghost-btn danger" id="presetDeleteBtn" type="button" hidden>삭제</button>
      <button class="ghost-btn wide primary" id="presetSaveBtn" type="button">저장하고 켜기</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightboxImg" alt="" />
</div>

<script src="./app.js" type="module"></script>
</body>
</html>
