name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check server/relay.mjs
          node --check web/app.js
          node --check web/sw.js
          python3 -c "import json; json.load(open('web/manifest.json', encoding='utf-8'))"
      - name: Every asset the page references exists
        run: |
          for f in styles.css app.js manifest.json icons/apple-touch-icon.png; do
            grep -q "$f" web/index.html || { echo "index.html no longer references $f"; exit 1; }
            test -f "web/$f" || { echo "missing web/$f"; exit 1; }
          done
          for f in icon-192.png icon-512.png icon-512-maskable.png; do
            grep -q "$f" web/manifest.json || { echo "manifest.json no longer references $f"; exit 1; }
            test -f "web/icons/$f" || { echo "missing web/icons/$f"; exit 1; }
          done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # turns Pages on for the repo if it has never been enabled
          enablement: true
      # Pages serves assets with max-age=600, so a phone happily keeps running
      # the previous bundle for ten minutes after a push. Stamping the asset
      # URLs makes every deploy a cache miss for those; stamping the meta tag
      # too lets index.html's own inline script notice ITS cached copy is
      # stale and reload — the one thing an asset-hash query can't cover,
      # since the document that contains it is what's cached.
      - name: Stamp build identifiers
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|\./styles\.css|./styles.css?v=$v|g; s|\./app\.js|./app.js?v=$v|g; s|__BUILD__|$v|" web/index.html
          grep -q "app.js?v=$v" web/index.html || { echo "asset stamping did not take"; exit 1; }
          grep -q "content=\"$v\"" web/index.html || { echo "build meta stamping did not take"; exit 1; }
          grep -o 'href="[^"]*"\|src="[^"]*"\|content="[a-f0-9]\{8\}"' web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
